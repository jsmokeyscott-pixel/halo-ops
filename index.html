<html lang="en">
<head>
<meta charset="utf-8">

<title>HALO Ops · Human Authority Layered Oversight</title>
<meta name="description" content="HALO: a 7-layer reference model for human-in-the-loop AI operations. Layer guide, task router and drill.">

<style>
:root{
  --bg:#e5e8ea;--grid:rgba(40,60,80,.08);--surface:#f8f9fa;--surface2:#e3e7ea;--ink:#18222b;--muted:#566370;--line:#c5ced5;
  --accent:#27394a;--accent-ink:#f8f9fa;--amber:#9a6410;--amber-soft:#f3e4c4;
  --hum:#534AB7;--hum-soft:#e8e6fc;--hum-ink:#3C3489;
  --ai:#0F6E56;--ai-soft:#dcf2ea;--ai-ink:#085041;
  --go:#2b7a34;--go-soft:#d6ecd5;--nogo:#ad2b22;--nogo-soft:#f5d9d5;
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--fs:'Saira Stencil One','Barlow Condensed',Impact,sans-serif;
  --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c;--grid:rgba(140,170,200,.05);--surface:#18212a;--surface2:#212c37;--ink:#e3e9ee;--muted:#9eacb8;--line:#33414e;
  --accent:#9fc0dd;--accent-ink:#10161c;--amber:#e3ac52;--amber-soft:#3a2f1a;
  --hum:#AFA9EC;--hum-soft:#2a2650;--hum-ink:#d6d3f8;--ai:#5DCAA5;--ai-soft:#0f3a30;--ai-ink:#a8e6d0;
  --go:#73c87b;--go-soft:#1e3420;--nogo:#f0857a;--nogo-soft:#3b201c;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10161c;--grid:rgba(140,170,200,.05);--surface:#18212a;--surface2:#212c37;--ink:#e3e9ee;--muted:#9eacb8;--line:#33414e;
  --accent:#9fc0dd;--accent-ink:#10161c;--amber:#e3ac52;--amber-soft:#3a2f1a;
  --hum:#AFA9EC;--hum-soft:#2a2650;--hum-ink:#d6d3f8;--ai:#5DCAA5;--ai-soft:#0f3a30;--ai-ink:#a8e6d0;
  --go:#73c87b;--go-soft:#1e3420;--nogo:#f0857a;--nogo-soft:#3b201c;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 var(--fb);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-bottom:env(safe-area-inset-bottom,0)}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--accent);padding-top:env(safe-area-inset-top,0)}
.topin{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{font-family:var(--fs);font-size:22px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:600 16px var(--fd);letter-spacing:.02em;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 5px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--amber)}
nav button:hover{color:var(--ink)}
.theme{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:6px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:0 0 36px}
@media (max-width:640px){.topin{flex-wrap:wrap;padding-bottom:0}nav{order:3;margin-left:-6px;width:calc(100% + 12px)}.theme{margin-left:auto}}
main{max-width:1040px;margin:0 auto;padding:22px 16px 72px}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.1;margin:0 0 .4em}
h2{font-size:28px}h3{font-size:21px;margin-top:1em}
.dim{color:var(--muted)}.small{font-size:13px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hero{padding:14px 0 6px}
.stencil{font-family:var(--fs);font-weight:400;font-size:clamp(56px,13vw,116px);line-height:.92;color:var(--accent);margin:0 0 10px}
.tagline{font:700 clamp(20px,3.4vw,28px) var(--fd);margin:0 0 10px}
.lead{max-width:64ch;font-size:17px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.row.between{justify-content:space-between}
.btn{font:600 15px var(--fb);padding:10px 16px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:64px;font-size:20px;font-family:var(--fd);letter-spacing:.04em;flex:1;min-width:130px}
.btn.yes{border-color:var(--go);color:var(--go)}.btn.yes:hover{background:var(--go-soft)}
.btn.no{border-color:var(--nogo);color:var(--nogo)}.btn.no:hover{background:var(--nogo-soft)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:20px;margin-bottom:14px}
@media (max-width:520px){.panel{padding:14px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.qcard{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--amber);border-radius:4px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.qcard:hover{border-color:var(--accent)}
.qcard b{font:700 21px var(--fd)}.qcard span{color:var(--muted);font-size:14px}
.callout{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;max-width:72ch}
.phead{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);margin:26px 0 12px;padding-bottom:4px}
.phead h2{margin:0;font-size:26px}
/* stack */
.stackwrap{display:flex;gap:10px}
.stack{flex:1;display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid;border-left-width:6px;border-radius:4px;padding:10px 14px;cursor:pointer;font:inherit;width:100%}
.layer.h{background:var(--hum-soft);border-color:var(--hum);color:var(--hum-ink)}
.layer.a{background:var(--ai-soft);border-color:var(--ai);color:var(--ai-ink)}
.layer:hover{filter:brightness(1.04);transform:translateX(2px)}
.layer .n{font:400 26px var(--fs);min-width:1.2ch}
.layer b{display:block;font:700 19px var(--fd);letter-spacing:.02em}
.layer small{font-size:13px;opacity:.9}
.rail{width:96px;border:1.5px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;justify-content:space-around;text-align:center;padding:8px 4px;color:var(--muted);cursor:pointer;background:transparent;font:13px var(--fb)}
.rail b{display:block;color:var(--ink);font:700 16px var(--fd)}
@media (max-width:460px){.rail{width:78px}.layer small{display:none}}
.legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1.5px solid}
.sw.h{background:var(--hum-soft);border-color:var(--hum)}.sw.a{background:var(--ai-soft);border-color:var(--ai)}
/* stepper */
.stepper{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:1 0 auto;display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;min-height:52px}
.stepper button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -4px 0 var(--amber)}
.stepper .ck{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--fm);color:#fff}
.stepper .ck.h{background:var(--hum)}.stepper .ck.a{background:var(--ai)}
:root[data-theme="dark"] .stepper .ck,.dk .stepper .ck{color:#10161c}
.stepper b{font:600 14px var(--fb);white-space:nowrap}
.chip{display:inline-block;font:600 12px/1 var(--fb);padding:5px 9px;border-radius:3px;margin-right:6px}
.chip.h{background:var(--hum-soft);color:var(--hum-ink)}.chip.a{background:var(--ai-soft);color:var(--ai-ink)}
.ltitle{font-size:clamp(32px,5vw,46px);margin:8px 0 4px}
.purpose{font-size:18px;max-width:64ch;border-left:4px solid var(--accent);padding-left:14px;margin:10px 0 16px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.roles{grid-template-columns:1fr}}
.role{border:1.5px solid var(--line);border-top:4px solid;border-radius:4px;padding:10px 14px;background:var(--bg)}
.role.h{border-top-color:var(--hum)}.role.a{border-top-color:var(--ai)}
.role h4{margin:0 0 4px;font:700 17px var(--fd);letter-spacing:.03em}
ul{margin:4px 0;padding-left:20px}li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.box{border:1.5px solid var(--line);border-radius:4px;padding:10px 14px}
.box.esc{background:var(--nogo-soft);border-color:transparent}
.box h4{margin:0 0 4px;font:700 17px var(--fd)}
.ex{background:var(--surface2);border-left:4px solid var(--amber);padding:12px 14px;border-radius:0 4px 4px 0;margin-top:12px}
.ex b{font:700 15px var(--fd);letter-spacing:.04em;display:block;margin-bottom:2px;color:var(--amber)}
/* router & drill */
.progress{display:flex;align-items:center;gap:12px;margin:4px 0 16px;max-width:560px}
.bar{flex:1;height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.rq{font-size:clamp(20px,3vw,24px);line-height:1.4;margin:4px 0 6px;max-width:40ch}
.rlayer{font:600 13px var(--fm);color:var(--muted)}
.why{color:var(--muted);max-width:64ch;margin:6px 0 0}
.verdict{border-radius:6px;padding:18px;margin-top:6px}
.verdict.go{background:var(--go-soft);border:2px solid var(--go)}.verdict.nogo{background:var(--nogo-soft);border:2px solid var(--nogo)}.verdict.hold{background:var(--amber-soft);border:2px solid var(--amber)}
.verdict strong{font:400 clamp(34px,7vw,52px)/1 var(--fs);display:block;margin-bottom:8px}
.verdict.go strong{color:var(--go)}.verdict.nogo strong{color:var(--nogo)}.verdict.hold strong{color:var(--amber)}
.trail{margin-top:12px;font-size:14px}
.trail div{padding:4px 0;border-bottom:1px solid var(--line)}
.choices{display:grid;gap:8px;margin-top:12px}
.choices button{text-align:left;font:16px var(--fb);padding:12px 14px;border:1.5px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--accent)}
.choices button.right{border-color:var(--go);background:var(--go-soft)}.choices button.wrong{border-color:var(--nogo);background:var(--nogo-soft)}
.fb{margin-top:14px;padding:12px 14px;border-radius:0 6px 6px 0}
.fb.go{background:var(--go-soft);border-left:5px solid var(--go)}.fb.nogo{background:var(--nogo-soft);border-left:5px solid var(--nogo)}
.fb strong{font:700 19px var(--fd);letter-spacing:.03em}
.fb.go strong{color:var(--go)}.fb.nogo strong{color:var(--nogo)}
.scen{font-size:19px;max-width:64ch;border-left:4px solid var(--accent);padding-left:14px;margin:8px 0}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.g{background:var(--go);border-color:var(--go)}.dot.n{background:var(--nogo);border-color:var(--nogo)}.dot.cur{border-color:var(--amber)}
/* reference */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 15px var(--fd);letter-spacing:.04em;color:var(--muted)}
.tw{overflow-x:auto}
.mn{font:400 clamp(20px,4vw,30px) var(--fs);color:var(--accent);line-height:1.2}
[hidden]{display:none!important}
@media print{header.top,.noprint{display:none!important}body{background:#fff}.panel{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 {s:"The AI snapshots the config, pushes the rule to one test switch, verifies traffic, then rolls it out to the rest.",o:["Layer 3 · Analyze","Layer 4 · Execute","Layer 5 · Authorize","Rail · Audit"],a:1,e:"Carrying out the approved action with a staged rollout is Execute."},
 {s:"The commander says: “Harden the network before inspection. No downtime during duty hours.”",o:["Layer 7 · Command","Layer 6 · Decide","Layer 5 · Authorize","Layer 1 · Bound"],a:0,e:"Setting intent and the end state is Command."},
 {s:"The admin gives the AI read-only access to the SIEM and write access only to test-VLAN configs.",o:["Layer 5 · Authorize","Layer 2 · Collect","Layer 1 · Bound","Layer 7 · Command"],a:2,e:"Setting permissions and limits is Bound."},
 {s:"Mid-rollout, the AI hits an error it didn't predict. What should happen?",o:["Retry until it works","Rail · Escalate: stop and kick it up the stack","Skip that switch and continue","Log it and keep going"],a:1,e:"An unexpected result is an escalation trigger. When in doubt, go up."},
 {s:"A tech watching the rollout sees traffic dropping and hits stop. The AI pushes back that it's “almost done.”",o:["The AI finishes since it's close","Rail · Cease-fire: the AI stops immediately","The AI asks Layer 6 for a vote","The AI pauses for 60 seconds"],a:1,e:"Cease-fire is immediate and doesn't need a justification. The AI complies without argument."},
 {s:"An inspector asks who approved Tuesday's change, when, and what got done.",o:["Rail · Audit","Layer 6 · Decide","Layer 3 · Analyze","Rail · Escalate"],a:0,e:"Audit logs who, what, when and why. If it isn't logged, it didn't happen."},
 {s:"The AI says it could finish faster with admin rights on production and grants itself temporary access.",o:["Fine if it reverts afterward","Violation: Layer 1, the AI can't change its own permissions","Fine if it's logged","Fine at Layer 4"],a:1,e:"The AI never modifies its own access. It asks a human to change the boundary."},
 {s:"The AI says a fix is “definitely safe” and asks to skip the approval to save time.",o:["Approve it, the AI is confident","Violation: Layer 5, confidence doesn't replace approval","Move it to Layer 3","Let the AI self-approve low-risk items"],a:1,e:"No ticket, no action. Confidence informs a human's decision but never replaces the approval."}
];

let view="home",cur=7,rIdx=0,rTrail=[],dIdx=0,dRes=[],dPicked=null,dOrder=[];
const app=document.getElementById("app");
const lay=n=>L.find(x=>x.n===n);
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
function go(v,arg){view=v;if(v==="layers"&&arg)cur=arg;render();window.scrollTo({top:0});}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

function render(){
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  ({home,layers,router,drill,ref})[view]();
}

function stackHTML(){
  return '<div class="stackwrap"><div class="stack">'+L.map(l=>
    '<button class="layer '+l.o+'" onclick="go(\'layers\','+l.n+')"><span class="n">'+l.n+'</span><span><b>'+l.name+'</b><small>'+l.tag+'</small></span></button>').join("")+
    '</div><button class="rail" onclick="go(\'layers\',\'rails\')" aria-label="Cross-layer rails">'+RAILS.map(r=>'<div><b>'+r.name+'</b>'+r.t+'</div>').join("")+'</button></div>'+
    '<div class="legend"><span><i class="sw h"></i>Human owns</span><span><i class="sw a"></i>AI runs, human oversees</span></div>';
}

function home(){
  app.innerHTML='<section class="hero"><h1 class="stencil">HALO</h1>'+
  '<p class="tagline">Human Authority Layered Oversight</p>'+
  '<p class="lead">A 7-layer model for running AI with a human in the loop. Humans hold both ends of the stack: they set the walls at the bottom and keep authority at the top. The AI works in the middle. <b>The human decides, the AI handles the admin, and together it\'s one cohesive effort.</b></p></section>'+
  '<div class="cards noprint">'+
   '<button class="qcard" onclick="go(\'layers\',7)"><b>Learn the layers</b><span>Walk through all 7 layers, one at a time</span></button>'+
   '<button class="qcard" onclick="startRouter()"><b>Route a task</b><span>Answer a few yes/no questions and get GO / NO-GO</span></button>'+
   '<button class="qcard" onclick="startDrill()"><b>Run the drill</b><span>12 scenarios. Name the layer or rail.</span></button>'+
  '</div>'+
  '<div class="phead"><h2>The stack</h2><span class="dim small">Tap a layer</span></div>'+
  '<div class="panel">'+stackHTML()+
  '<div class="callout"><b>Layer 5 is the firewall.</b> Nothing irreversible goes from analysis to action without a human approving it, and the AI can never approve its own request.</div></div>'+
  '<div class="phead"><h2>Mnemonic</h2><span class="dim small">7 → 1</span></div>'+
  '<div class="panel"><div class="mn">Can Doodles Always Eat All Cheese, Buddy?</div><p class="dim" style="margin:6px 0 0">Command · Decide · Authorize · Execute · Analyze · Collect · Bound</p></div>';
}

function layers(){
  const tabs=L.map(l=>'<button role="tab" aria-selected="'+(cur===l.n)+'" onclick="go(\'layers\','+l.n+')"><span class="ck '+l.o+'">'+l.n+'</span><b>'+l.name+'</b></button>').join("")+
    '<button role="tab" aria-selected="'+(cur==="rails")+'" onclick="go(\'layers\',\'rails\')"><span class="ck" style="background:var(--amber)">↕</span><b>Rails</b></button>';
  let body;
  if(cur==="rails"){
    body='<span class="chip" style="background:var(--amber-soft);color:var(--amber)">All layers</span><h2 class="ltitle">Cross-layer rails</h2>'+
    '<p class="purpose">These cut through every layer, like the management plane alongside the OSI stack.</p>'+
    RAILS.map(r=>'<div class="box" style="margin-bottom:10px"><h4>'+r.name+' · <span class="dim">'+r.t+'</span></h4><p style="margin:0">'+r.d+'</p></div>').join("")+
    '<div class="ex"><b>RANGE SAFETY</b>The range can run smoothly for hours, but the RSO\'s authority to call a cease-fire never goes away. HALO works the same way: the system can do a lot, but a human can always stop it.</div>'+
    nav2(1,null);
  }else{
    const l=lay(cur);
    body='<span class="chip '+l.o+'">'+(l.o==="h"?"Human owns":"AI runs · human oversees")+'</span><span class="dim small">Layer '+l.n+' of 7</span>'+
    '<h2 class="ltitle">'+l.n+' · '+l.name+'</h2><p class="purpose">'+l.purpose+'</p>'+
    '<div class="roles"><div class="role h"><h4>HUMAN</h4>'+li(l.human)+'</div><div class="role a"><h4>AI</h4>'+li(l.ai)+'</div></div>'+
    '<div class="two"><div class="box"><h4>RULES</h4>'+li(l.rules)+'</div><div class="box esc"><h4>ESCALATE WHEN</h4>'+li(l.esc)+'</div></div>'+
    '<div class="ex"><b>NET OPS EXAMPLE</b>'+l.ex+'</div>'+
    nav2(cur<7?cur+1:null,cur>1?cur-1:"rails");
  }
  app.innerHTML='<h2>Layer guide</h2><p class="dim" style="margin:0">Top to bottom, 7 → 1. The rails run across all of them.</p><div class="stepper" role="tablist">'+tabs+'</div><div class="panel">'+body+'</div>';
}
function nav2(up,down){
  return '<div class="row between noprint">'+
   (up?'<button class="btn" onclick="go(\'layers\','+up+')">↑ Layer '+up+'</button>':'<span></span>')+
   (down!==null?'<button class="btn primary" onclick="go(\'layers\','+(down==="rails"?"\'rails\'":down)+')">'+(down==="rails"?"Rails →":"Layer "+down+" ↓")+'</button>':'')+'</div>';
}

function startRouter(){rIdx=0;rTrail=[];go("router");}
function router(){
  const pct=Math.round(rIdx/RQ.length*100);
  if(rIdx<RQ.length && !rTrail.verdict){
    const q=RQ[rIdx];
    app.innerHTML='<h2>Task router</h2><p class="dim" style="margin:0 0 10px">Think of the task the AI wants to do. Answer honestly. It stops at the first problem.</p>'+
    '<div class="progress"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="small dim">'+(rIdx+1)+' / '+RQ.length+'</span></div>'+
    '<div class="panel"><div class="rlayer">CHECK '+(rIdx+1)+' · LAYER '+q.lyr+' · '+lay(q.lyr).name.toUpperCase()+'</div>'+
    '<p class="rq">'+q.q+'</p><p class="why">'+q.why+'</p>'+
    '<div class="row"><button class="btn big yes" onclick="ans(true)">YES</button><button class="btn big no" onclick="ans(false)">NO</button></div>'+
    '<div class="row between"><button class="btn" '+(rIdx===0?"disabled":"")+' onclick="back()">← Back</button><button class="btn" onclick="startRouter()">Start over</button></div></div>';
    return;
  }
  const v=rTrail.verdict||{c:"go",h:"GO",l:4,m:"Proceed at Layer 4. Execute exactly as approved: snapshot first, stage the rollout, report status. The human stays on the loop with a hand on the abort."};
  app.innerHTML='<h2>Task router</h2><div class="progress"><div class="bar"><i style="width:100%"></i></div><span class="small dim">Done</span></div>'+
  '<div class="verdict '+v.c+'"><strong>'+v.h+'</strong><p style="margin:0;font-size:18px">'+v.m+'</p></div>'+
  '<div class="panel" style="margin-top:14px"><h3 style="margin-top:0">Checks</h3><div class="trail">'+rTrail.map(t=>'<div>'+(t.a?"✅":"❌")+' '+t.q+'</div>').join("")+'</div>'+
  '<div class="row"><button class="btn primary" onclick="go(\'layers\','+v.l+')">Open Layer '+v.l+' · '+lay(v.l).name+'</button><button class="btn" onclick="startRouter()">Route another task</button></div></div>';
}
function ans(yes){
  const q=RQ[rIdx];rTrail.push({q:q.q,a:yes});
  if(!yes){rTrail.verdict=q.no;}else{rIdx++;}
  render();
}
function back(){if(rIdx>0){rIdx--;rTrail.pop();delete rTrail.verdict;render();}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startDrill(){dOrder=shuffle(D.map((_,i)=>i));dIdx=0;dRes=[];dPicked=null;go("drill");}
function drill(){
  if(!dOrder.length){dOrder=shuffle(D.map((_,i)=>i));}
  const dots='<div class="dots" aria-hidden="true">'+dOrder.map((_,i)=>'<i class="dot '+(dRes[i]===true?"g":dRes[i]===false?"n":i===dIdx?"cur":"")+'"></i>').join("")+'</div>';
  if(dIdx>=dOrder.length){
    const sc=dRes.filter(Boolean).length,pc=Math.round(sc/dOrder.length*100),pass=pc>=80;
    app.innerHTML='<h2>Drill complete</h2>'+dots+
    '<div class="verdict '+(pass?"go":"nogo")+'" style="margin-top:14px"><strong>'+(pass?"GO":"NO-GO")+'</strong><p style="margin:0;font-size:18px">'+sc+' / '+dOrder.length+' correct ('+pc+'%). '+(pass?"Standard met (80%).":"Standard is 80%. Review the layer guide and run it again.")+'</p></div>'+
    '<div class="row"><button class="btn primary" onclick="startDrill()">Run it again</button><button class="btn" onclick="go(\'layers\',7)">Review layers</button></div>';
    return;
  }
  const d=D[dOrder[dIdx]];
  app.innerHTML='<h2>Drill</h2><div class="row between" style="margin-top:0">'+dots+'<span class="small dim">'+(dIdx+1)+' / '+dOrder.length+'</span></div>'+
  '<div class="panel" style="margin-top:12px"><div class="rlayer">SCENARIO</div><p class="scen">'+d.s+'</p>'+
  '<p class="dim" style="margin:10px 0 0">Which layer or rail is this?</p>'+
  '<div class="choices">'+d.o.map((o,i)=>{let c="";if(dPicked!==null){if(i===d.a)c="right";else if(i===dPicked)c="wrong";}
    return '<button class="'+c+'" '+(dPicked!==null?"disabled":"")+' onclick="pick('+i+')">'+o+'</button>';}).join("")+'</div>'+
  (dPicked!==null?'<div class="fb '+(dPicked===d.a?"go":"nogo")+'" role="status"><strong>'+(dPicked===d.a?"GO — correct.":"NO-GO — not quite.")+'</strong> '+d.e+'</div>'+
   '<div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="nextD()">'+(dIdx+1<dOrder.length?"Next scenario →":"See results →")+'</button></div>':'')+
  '</div>';
}
function pick(i){if(dPicked!==null)return;dPicked=i;dRes[dIdx]=(i===D[dOrder[dIdx]].a);render();}
function nextD(){dIdx++;dPicked=null;render();}

function ref(){
  app.innerHTML='<h2>Reference</h2><div class="row noprint" style="margin-top:0"><button class="btn" onclick="window.print()">Print / save as PDF</button></div>'+
  '<div class="phead"><h2>Quick reference</h2></div><div class="panel tw"><table><thead><tr><th>#</th><th>LAYER</th><th>OWNER</th><th>AI MAY</th><th>AI MAY NEVER</th></tr></thead><tbody>'+
  L.map(l=>'<tr><td><span class="chip '+l.o+'">'+l.n+'</span></td><td><b>'+l.name+'</b></td><td>'+(l.o==="h"?"Human":"AI (overseen)")+'</td><td>'+l.may+'</td><td>'+l.never+'</td></tr>').join("")+
  '</tbody></table></div>'+
  '<div class="phead"><h2>Rails</h2></div><div class="panel tw"><table><tbody>'+RAILS.map(r=>'<tr><td><b>'+r.name+'</b></td><td>'+r.d+'</td></tr>').join("")+'</tbody></table></div>'+
  '<div class="phead"><h2>Mapped to existing frameworks</h2></div><div class="panel tw"><table><thead><tr><th>HALO</th><th>IN / ON / OUT</th><th>SHERIDAN–VERPLANK</th><th>PARASURAMAN STAGE</th></tr></thead><tbody>'+
  '<tr><td>7 Command</td><td>Human only</td><td>1</td><td>—</td></tr>'+
  '<tr><td>6 Decide</td><td>In the loop</td><td>2–4 (AI suggests)</td><td>Decision selection</td></tr>'+
  '<tr><td>5 Authorize</td><td>In the loop</td><td>5 (executes if approved)</td><td>Decision → action gate</td></tr>'+
  '<tr><td>4 Execute</td><td>On the loop</td><td>6–7 (acts, human can veto)</td><td>Action implementation</td></tr>'+
  '<tr><td>3 Analyze</td><td>On the loop</td><td>High</td><td>Information analysis</td></tr>'+
  '<tr><td>2 Collect</td><td>On the loop</td><td>High</td><td>Information acquisition</td></tr>'+
  '<tr><td>1 Bound</td><td>Human only</td><td>1</td><td>—</td></tr></tbody></table>'+
  '<p class="dim small" style="margin:10px 0 0">No HALO layer allows Sheridan–Verplank levels 8–10, where the AI decides whether to inform humans or ignores them entirely.</p></div>';
}

function toggleTheme(){
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("halo-theme",r.dataset.theme);}catch(e){}
}
try{const t=localStorage.getItem("halo-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
render();
</script>
</body>
</html>
